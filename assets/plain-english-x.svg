<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 467" role="img" aria-label="plain-english — dense reply in, plain reply out" shape-rendering="crispEdges" style="image-rendering: pixelated; image-rendering: crisp-edges;">
  <title>plain-english — write for a second-language reader</title>
  <desc>Pixel-art banner for the plain-english Claude Code skill. Title "plain-english" at top left. Below, three cards left to right: a DENSE card with "blast radius" and "it will bite you" struck through; a warm-orange SWAP card showing the plain replacements plus a green KEEP chip protecting React, async and PR; and a PLAIN card with the answer highlighted on the first line and a blue STILL WARM chip. Pixel arrows connect the cards; chapter markers run underneath.</desc>

  <defs>
    <pattern id="scan-x" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f5efe6"/>
      <rect y="6" width="8" height="2" fill="#eadfcf"/>
    </pattern>
  </defs>
  <rect width="1600" height="467" fill="url(#scan-x)"/>

  <!-- =========== TITLE BLOCK (top-left) =========== -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace">
    <text x="60" y="84" font-size="42" font-weight="700" fill="#1f2937" letter-spacing="4">plain-english</text>
    <text x="62" y="116" font-size="18" fill="#6b7280">write for the reader, not for yourself</text>
    <text x="62" y="142" font-size="11" fill="#9ca3af" letter-spacing="4">INSTALL ONCE · APPLIES EVERY REPLY</text>
  </g>

  <!-- ============ CARD A — DENSE (paper) ============ -->
  <g transform="translate(120, 190)">
    <rect x="0" y="0" width="400" height="220" fill="#fdf7ea"/>
    <rect x="0" y="0" width="400" height="4" fill="#c9b58a"/>
    <rect x="0" y="216" width="400" height="4" fill="#b79a5c"/>
    <rect x="396" y="0" width="4" height="220" fill="#b79a5c"/>
    <rect x="0" y="30" width="400" height="2" fill="#c9b58a"/>
    <text x="16" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#6b7280" letter-spacing="3">DENSE</text>

    <text x="16" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="15" fill="#1f2937">Caveat first, then the answer...</text>

    <text x="16" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="16" fill="#b91c1c">blast radius</text>
    <rect x="16" y="114" width="122" height="2" fill="#b91c1c"/>

    <text x="16" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="16" fill="#b91c1c">it will bite you</text>
    <rect x="16" y="150" width="153" height="2" fill="#b91c1c"/>

    <text x="16" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#9ca3af" letter-spacing="1">hard words + buried answer</text>
  </g>

  <!-- arrow A -> B (entering, muted) -->
  <g fill="#6b7280">
    <rect x="548" y="297" width="34" height="6"/>
    <rect x="580" y="291" width="6" height="6"/>
    <rect x="586" y="297" width="6" height="6"/>
    <rect x="580" y="303" width="6" height="6"/>
  </g>

  <!-- ============ CARD B — SWAP (warm accent) ============ -->
  <g transform="translate(600, 190)">
    <rect x="0" y="0" width="400" height="220" fill="#c2410c"/>
    <rect x="0" y="0" width="400" height="4" fill="#ea580c"/>
    <rect x="0" y="216" width="400" height="4" fill="#7c2d12"/>
    <rect x="396" y="0" width="4" height="220" fill="#7c2d12"/>
    <rect x="0" y="30" width="400" height="2" fill="#7c2d12"/>
    <text x="16" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#fed7aa" letter-spacing="3">SWAP</text>

    <text x="18" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#fdba74">blast radius</text>
    <text x="18" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#fdf7ea">→ how much it affects</text>

    <text x="18" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="14" fill="#fdba74">it will bite you</text>
    <text x="18" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#fdf7ea">→ it will cause problems later</text>

    <rect x="16" y="168" width="230" height="30" fill="#dcfce7"/>
    <rect x="16" y="168" width="230" height="3" fill="#86efac"/>
    <text x="26" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#15803d">KEEP  React  async  PR</text>
  </g>

  <!-- arrow B -> C (exiting, warm) -->
  <g fill="#c2410c">
    <rect x="1028" y="297" width="34" height="6"/>
    <rect x="1060" y="291" width="6" height="6"/>
    <rect x="1066" y="297" width="6" height="6"/>
    <rect x="1060" y="303" width="6" height="6"/>
  </g>

  <!-- ============ CARD C — PLAIN (paper) ============ -->
  <g transform="translate(1080, 190)">
    <rect x="0" y="0" width="400" height="220" fill="#fdf7ea"/>
    <rect x="0" y="0" width="400" height="4" fill="#c9b58a"/>
    <rect x="0" y="216" width="400" height="4" fill="#b79a5c"/>
    <rect x="396" y="0" width="4" height="220" fill="#b79a5c"/>
    <rect x="0" y="30" width="400" height="2" fill="#c9b58a"/>
    <text x="16" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#6b7280" letter-spacing="3">PLAIN</text>

    <rect x="14" y="48" width="368" height="30" fill="#fde68a"/>
    <rect x="14" y="48" width="368" height="3" fill="#fbbf24"/>
    <text x="24" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="700" fill="#1f2937">Yes. Here is the answer.</text>

    <text x="16" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="15" fill="#1f2937">It changes how much it</text>
    <text x="16" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="15" fill="#1f2937">affects the cache.</text>

    <rect x="16" y="160" width="150" height="26" fill="#bae6fd"/>
    <rect x="16" y="160" width="150" height="3" fill="#0e7490"/>
    <text x="26" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#0e7490">STILL WARM</text>

    <text x="16" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="11" fill="#9ca3af" letter-spacing="1">answer first, plain words</text>
  </g>

  <!-- ============ CHAPTER MARKERS ============ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, DejaVu Sans Mono, monospace" font-size="12" fill="#6b7280" letter-spacing="3">
    <text x="120" y="446">WORDS · AMOUNT · ORDER · KEEP TERMS · STAY WARM</text>
  </g>
</svg>
