<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-label="plain-english icon: a long crossed-out word becoming a short plain one" style="image-rendering: pixelated;">
  <title>plain-english</title>
  <!-- the hard word (warm accent) -->
  <g fill="#c2410c">
    <rect x="2" y="4" width="28" height="6"/>
  </g>
  <!-- strike, arrow down, and the plain word (ink) -->
  <g fill="#1f2937">
    <!-- struck through -->
    <rect x="0" y="6" width="32" height="2"/>
    <!-- arrow: shaft -->
    <rect x="15" y="13" width="2" height="5"/>
    <!-- arrow: head -->
    <rect x="12" y="18" width="8" height="2"/>
    <rect x="14" y="20" width="4" height="2"/>
    <!-- the plain word -->
    <rect x="7" y="25" width="18" height="4"/>
  </g>
</svg>
